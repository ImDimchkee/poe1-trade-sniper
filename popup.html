<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVITLANA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #1a1a1a;
      color: #d0c4a0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 9px;
      border-bottom: 1px solid #2e2a1e;
      background: #111;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #c8a84b;
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #4caf50;
      box-shadow: 0 0 6px #4caf50;
    }
    .status-dot.red   { background: #e53935; box-shadow: 0 0 6px #e53935; }
    .status-dot.yellow{ background: #fbc02d; box-shadow: 0 0 6px #fbc02d; }

    /* ── Section ── */
    .section { padding: 12px 14px; border-bottom: 1px solid #252015; }

    /* ── Toggle ── */
    .row-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .row-toggle label { color: #a09070; font-size: 12px; }
    .toggle-wrap { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle-wrap input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #333;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: #888;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .slider { background: #2d4a1e; }
    input:checked + .slider:before { transform: translateX(20px); background: #4caf50; }

    /* ── Click history ── */
    .history-label { font-size: 11px; color: #6a5a40; margin-bottom: 6px; }
    .history-list {
      background: #0e0e0e;
      border: 1px solid #2a2010;
      border-radius: 4px;
      height: 130px;
      overflow-y: auto;
      font-size: 11px;
      font-family: 'Courier New', monospace;
    }
    .history-empty {
      padding: 8px;
      color: #4a4030;
      font-style: italic;
      font-family: 'Segoe UI', sans-serif;
    }
    .history-entry {
      display: flex;
      justify-content: space-between;
      padding: 3px 7px;
      border-bottom: 1px solid #1a1a0e;
      color: #8a7a60;
    }
    .history-entry:last-child { border-bottom: none; }
    .history-entry .h-time { color: #4a4030; flex-shrink: 0; margin-right: 6px; }
    .history-entry .h-name { color: #c8a84b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .history-entry .h-price { color: #8aaa8a; flex-shrink: 0; margin-left: 6px; }

    /* ── Rate bar ── */
    .rate-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #6a5a40;
      margin-bottom: 4px;
    }
    .rate-bar-bg {
      height: 6px;
      background: #2a2010;
      border-radius: 3px;
      overflow: hidden;
    }
    .rate-bar {
      height: 100%;
      width: 0%;
      background: #c8a84b;
      border-radius: 3px;
      transition: width 0.3s, background 0.3s;
    }

    /* ── Action button (START / STOP / WAITING) ── */
    .action-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 9px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-align: center;
      outline: none;
    }
    .action-btn-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 0%;
      background: rgba(200, 160, 50, 0.38);
      border-radius: inherit;
      pointer-events: none;
      transition: width 0.25s linear;
    }
    .action-btn-text { position: relative; z-index: 1; }

    .action-btn.stop  { background: #5a1010; border: 1px solid #8b2020; color: #ffcdd2; }
    .action-btn.stop:hover { background: #8b1a1a; }
    .action-btn.start { background: #1a3a1a; border: 1px solid #2d6a2d; color: #a0d0a0; }
    .action-btn.start:hover { background: #2d5a2d; }
    .action-btn.waiting { background: #2a1e00; border: 1px solid #7a6020; color: #fbc02d; cursor: default; }

    /* ── Debug ── */
    .debug-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .debug-header span { font-size: 12px; color: #6a5a40; }
    .debug-toggle-wrap { position: relative; display: inline-block; width: 36px; height: 20px; }
    .debug-toggle-wrap input { opacity: 0; width: 0; height: 0; }
    .debug-slider {
      position: absolute; inset: 0;
      background: #2a2010;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .debug-slider:before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: #555;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .debug-slider { background: #2a3a10; }
    input:checked + .debug-slider:before { transform: translateX(16px); background: #8bc34a; }

    .log-box {
      background: #0e0e0e;
      border: 1px solid #2a2010;
      border-radius: 4px;
      height: 120px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 6px;
      color: #6a8a6a;
      display: none;
    }
    .log-box.visible { display: block; }
    .log-entry { padding: 1px 0; border-bottom: 1px solid #1a1a0e; }
    .log-entry.error { color: #e57373; }
    .log-entry.warn  { color: #fbc02d; }
    .log-entry.info  { color: #6a9a6a; }
    .log-entry.debug { color: #4a6a4a; }

    .btn-export {
      width: 100%;
      padding: 6px;
      background: #1a1a0e;
      border: 1px solid #3a3a20;
      border-radius: 4px;
      color: #8a8a60;
      font-size: 11px;
      cursor: pointer;
      margin-top: 6px;
      display: none;
      transition: background 0.15s;
    }
    .btn-export:hover { background: #2a2a10; }
    .btn-export.visible { display: block; }

    .shortcut-hint {
      text-align: center;
      font-size: 10px;
      color: #3a3020;
      padding: 6px 0 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-title">SVITLANA</span>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <div class="section">
    <div class="row-toggle">
      <label for="toggleEnabled">Sniping</label>
      <label class="toggle-wrap">
        <input type="checkbox" id="toggleEnabled" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="history-label">Click history</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">No clicks yet</div>
    </div>
  </div>

  <div class="section">
    <div class="rate-label">
      <span>Rate limit (account)</span>
      <span id="rateText">0 / 6</span>
    </div>
    <div class="rate-bar-bg">
      <div class="rate-bar" id="rateBar"></div>
    </div>
  </div>

  <div class="section">
    <button class="action-btn stop" id="actionBtn">
      <span id="actionBtnFill" class="action-btn-fill"></span>
      <span id="actionBtnText">■  STOP</span>
    </button>
  </div>

  <div class="section">
    <div class="debug-header">
      <span>Auto-resume after rate limit</span>
      <label class="debug-toggle-wrap">
        <input type="checkbox" id="toggleAutoResume" checked>
        <span class="debug-slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="debug-header">
      <span>Debug mode</span>
      <label class="debug-toggle-wrap">
        <input type="checkbox" id="toggleDebug">
        <span class="debug-slider"></span>
      </label>
    </div>
    <div class="log-box" id="logBox"></div>
    <button class="btn-export" id="btnExport">Export log (.json)</button>
  </div>

  <div class="shortcut-hint">Emergency stop: ⌘⇧X / Ctrl+Shift+X</div>

  <script src="popup.js"></script>
</body>
</html>
